# =====================================================================
# FUNecob — tabelas exportadas/importadas por organização (tenant).
#
# Formato:  <schema.tabela>|<predicado WHERE com o placeholder %ORG%>
#
# A ordem importa: pais primeiro, filhos depois (FKs).
# Linhas iniciadas por # são ignoradas.
#
# %ORG% é substituído pelo UUID da organização (aspas simples incluídas
# pelo script). Nenhuma credencial deve constar deste arquivo.
# =====================================================================

# --- núcleo ----------------------------------------------------------
public.organizations|id = %ORG%
public.profiles|id IN (SELECT user_id FROM public.organization_members WHERE organization_id = %ORG%)
public.user_roles|user_id IN (SELECT user_id FROM public.organization_members WHERE organization_id = %ORG%)
public.organization_members|organization_id = %ORG%
public.subscriptions|organization_id = %ORG%
public.org_api_keys|organization_id = %ORG%

