# =====================================================================
# Nginx do HOST (VPS) — financeiro.funecob.com.br
# Encaminha para o container funecob-web publicado em 127.0.0.1:8080.
#
# Estrutura preparada para HTTPS, porém SEM certificado real.
# Para emitir o certificado depois:
#   apt-get install -y certbot python3-certbot-nginx
#   certbot --nginx -d financeiro.funecob.com.br
# O certbot preenche automaticamente ssl_certificate/ssl_certificate_key.
# Enquanto não houver certificado, mantenha apenas o bloco HTTP (porta 80)
# ativo e deixe o bloco HTTPS comentado.
# =====================================================================

upstream funecob_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name financeiro.funecob.com.br;

    # Validação ACME (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Após emitir o certificado, troque o bloco abaixo por:
    # return 301 https://$host$request_uri;
    location / {
        proxy_pass         http://funecob_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

