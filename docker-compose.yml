# =====================================================================
# FUNecob — Stack COMPLETA e INDEPENDENTE (VPS)
# Nada aqui é compartilhado com o projeto Nexus 33:
# rede, volumes, containers e portas são exclusivos do FUNecob.
#
# Subir:      ./deploy/install.sh
# Atualizar:  ./deploy/update.sh
# =====================================================================

name: funecob

networks:
  funecob_network:
    name: funecob_network
    driver: bridge

volumes:
  funecob_db_data:
    name: funecob_db_data
  funecob_storage_data:
    name: funecob_storage_data
  funecob_caddy_data:
    name: funecob_caddy_data
  funecob_caddy_config:
    name: funecob_caddy_config

x-common: &common
  restart: unless-stopped
  networks: [funecob_network]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  # -------------------------------------------------------------- DB
  funecob-db:
    <<: *common
    image: supabase/postgres:15.8.1.060
    container_name: funecob-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXP: ${JWT_EXPIRY:-3600}
      TZ: ${TZ:-America/Sao_Paulo}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_preload_libraries=pg_stat_statements,pg_cron
      - -c
      - cron.database_name=${POSTGRES_DB:-postgres}
    volumes:
      - funecob_db_data:/var/lib/postgresql/data
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54322}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ------------------------------------------------------------ AUTH
  funecob-auth:
    <<: *common
    image: supabase/gotrue:v2.170.0
    container_name: funecob-auth
    depends_on:
      funecob-db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@funecob-db:5432/${POSTGRES_DB:-postgres}?search_path=auth&sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-no-reply@funecob.com.br}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-FUNecob}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_PASSWORD_MIN_LENGTH: "6"
      TZ: ${TZ:-America/Sao_Paulo}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------ REST
  funecob-rest:
    <<: *common
    image: postgrest/postgrest:v12.2.3
    container_name: funecob-rest
    depends_on:
      funecob-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@funecob-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage,graphql_public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
    command: ["postgrest"]

  # -------------------------------------------------------- REALTIME
  funecob-realtime:
    <<: *common
    image: supabase/realtime:v2.34.31
    container_name: funecob-realtime
    depends_on:
      funecob-db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: funecob-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_ENC_KEY:?defina REALTIME_ENC_KEY no .env}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${REALTIME_SECRET_KEY_BASE:?defina REALTIME_SECRET_KEY_BASE no .env}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: funecob-realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  # --------------------------------------------------------- STORAGE
  funecob-storage:
    <<: *common
    image: supabase/storage-api:v1.19.3
    container_name: funecob-storage
    depends_on:
      funecob-db:
        condition: service_healthy
      funecob-rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://funecob-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@funecob-db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:-52428800}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: funecob
      REGION: local
      GLOBAL_S3_BUCKET: funecob
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - funecob_storage_data:/var/lib/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # -------------------------------------------------- EDGE FUNCTIONS
  funecob-edge-functions:
    <<: *common
    image: supabase/edge-runtime:v1.67.4
    container_name: funecob-edge-functions
    depends_on:
      funecob-db:
        condition: service_healthy
    environment:
      SUPABASE_URL: http://funecob-kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD}@funecob-db:5432/${POSTGRES_DB:-postgres}
      SUPABASE_JWT_SECRET: ${JWT_SECRET}
      VERIFY_JWT: "false"
      PORTAL_BASE_URL: ${PORTAL_BASE_URL}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LOVABLE_API_KEY: ${LOVABLE_API_KEY:-}
      BIP_API_KEY: ${BIP_API_KEY:-}
      TZ: ${TZ:-America/Sao_Paulo}
    # Permite alcançar a Evolution API JÁ EXISTENTE na VPS (container "evolution",
    # publicado em 8080 no host). EVOLUTION_API_URL deve usar host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./supabase/functions:/home/deno/functions:ro
    command: ["start", "--main-service", "/home/deno/functions"]
  # ------------------------------------------------------------ CRON
  # Agendador próprio do FUNecob (billing-cron, whatsapp-sender,
  # pix-ocr-retry). Substitui o pg_cron do Supabase Cloud.
  funecob-cron:
    <<: *common
    image: alpine:3.20
    container_name: funecob-cron
    depends_on:
      funecob-kong:
        condition: service_started
      funecob-edge-functions:
        condition: service_started
    environment:
      KONG_INTERNAL_URL: http://funecob-kong:8000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      CRON_TICK_SECONDS: ${CRON_TICK_SECONDS:-120}
      BILLING_CRON_HOUR: ${BILLING_CRON_HOUR:-08}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ./deploy/cron/funecob-cron.sh:/opt/funecob-cron.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl tzdata >/dev/null && exec /bin/sh /opt/funecob-cron.sh"]


  # ------------------------------------------------------------ KONG
  funecob-kong:
    <<: *common
    image: kong:2.8.1
    container_name: funecob-kong
    depends_on:
      funecob-auth:
        condition: service_started
      funecob-rest:
        condition: service_started
      funecob-storage:
        condition: service_started
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./deploy/kong/kong.yml:/home/kong/kong.yml:ro
    ports:
      - "127.0.0.1:${KONG_HTTP_PORT:-54321}:8000"

  # ------------------------------------------------------------- WEB
  funecob-web:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${ANON_KEY}
        VITE_SUPABASE_PROJECT_ID: ${SUPABASE_PROJECT_ID:-funecob}
        VITE_PORTAL_BASE_URL: ${PORTAL_BASE_URL}
    image: funecob/web:latest
    container_name: funecob-web
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
    security_opt:
      - no-new-privileges:true
    # Porta só no loopback: permite que um proxy já existente na VPS
    # (Caddy/Nginx/Traefik de outro projeto) faça proxy sem expor nada.
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-54320}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------
  # EVOLUTION API / MONGODB — NÃO SÃO DEFINIDOS AQUI DE PROPÓSITO.
  # A VPS já possui em produção:
  #   container "evolution"    (atendai/evolution-api:v1.6.0, porta 8080)
  #   container "mongodb-lab"  (mongo:7, rede "evolution-lab")
  # O FUNecob REUTILIZA esses serviços via EVOLUTION_API_URL/EVOLUTION_API_KEY.
  # NUNCA recriar, substituir ou remover esses containers.
  # ---------------------------------------------------------------

  # ----------------------------------------------------------- CADDY
  # Proxy DEDICADO do FUNecob — OPCIONAL.
  # Só sobe com: COMPOSE_PROFILES=proxy  (ou USE_OWN_PROXY=true no .env).
  # Se a VPS já usa 80/443 em outro proxy, NÃO habilite este serviço:
  # aponte o proxy existente para 127.0.0.1:${WEB_HTTP_PORT} e :${KONG_HTTP_PORT}.
  funecob-caddy:
    <<: *common
    profiles: ["proxy"]
    image: caddy:2-alpine
    container_name: funecob-caddy
    depends_on:
      - funecob-web
      - funecob-kong
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "${CADDY_BIND_IP:-0.0.0.0}:${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_BIND_IP:-0.0.0.0}:${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - funecob_caddy_data:/data
      - funecob_caddy_config:/config
