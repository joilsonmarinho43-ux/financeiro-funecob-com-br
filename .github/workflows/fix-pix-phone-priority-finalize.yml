name: Finalize PIX phone priority fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix remaining stale reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("supabase/functions/pix-ocr-settlement/index.ts")
          s = p.read_text()
          old = 'switched_from_phone: switchedFromPhone'
          if old not in s:
              raise SystemExit("ERRO: referência stale não encontrada")
          s = s.replace(old, 'whatsapp_identity_match: whatsappIdentityMatch', 1)
          p.write_text(s)
          PY
          git diff --check
          grep -n -E 'switchedFromPhone|whatsappIdentityMatch' supabase/functions/pix-ocr-settlement/index.ts
          rm .github/workflows/fix-pix-phone-priority-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/pix-ocr-settlement/index.ts .github/workflows/fix-pix-phone-priority-finalize.yml
          git commit -m "fix: remover referencia stale da baixa pix"
          git push origin main
