name: Apply security hardening patch

on:
  push:
    branches: [ security-hardening-2026-09 ]
    paths:
      - '.github/workflows/apply-security-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[security-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply minimal hardening patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'PATCH TARGET NOT FOUND: {path}: {old[:120]!r}')
              if s.count(old) != 1:
                  raise SystemExit(f'PATCH TARGET NOT UNIQUE: {path}: {s.count(old)} matches')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 1) WhatsApp manager: bind every instance operation to the caller organization.
          replace_once(
              'supabase/functions/whatsapp-manager/index.ts',
              '    const body = await req.json();\n    const { action, instance_id, instance_name, organization_id } = body;\n\n    if (!action) {',
              '''    const body = await req.json();
    const { action, instance_id, instance_name, organization_id } = body;

    const { data: callerOrganizationId, error: callerOrganizationError } = await supabase
      .rpc("get_user_organization_id", { _user_id: user.id });
    if (callerOrganizationError || !callerOrganizationId) {
      return new Response(JSON.stringify({ error: "Usuário sem organização autorizada" }), {
        status: 403,
        headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }

    if (organization_id && organization_id !== callerOrganizationId) {
      return new Response(JSON.stringify({ error: "Acesso negado para esta organização" }), {
        status: 403,
        headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }

    if (instance_id) {
      const { data: authorizedInstance } = await supabase
        .from("whatsapp_instances")
        .select("id, organization_id")
        .eq("id", instance_id)
        .eq("organization_id", callerOrganizationId)
        .maybeSingle();
      if (!authorizedInstance) {
        return new Response(JSON.stringify({ error: "Instância não encontrada ou não pertence à sua organização" }), {
          status: 404,
          headers: { ...corsHeaders, "Content-Type": "application/json" },
        });
      }
    }

    if (!action) {'''
          )

          # 2) Global webhook registration is maintenance-only; never expose a global
          # service-role operation to ordinary authenticated users.
          replace_once(
              'supabase/functions/register-pix-webhook/index.ts',
              '  try {\n    const authHeader = req.headers.get("Authorization");',
              '''  try {
    const authHeader = req.headers.get("Authorization") || "";
    const expectedServiceAuth = `Bearer ${SERVICE_KEY}`;
    if (!SERVICE_KEY || authHeader !== expectedServiceAuth) {
      return new Response(JSON.stringify({ error: "unauthorized" }), {
        status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }
    /* Service-role only: this function intentionally operates globally. */
    /* The old user JWT flow is retained below only as dead-code guard context. */'''
          )

          # 3) Cron-only functions: accept only the service-role bearer used by the
          # existing in-container cron. No browser/user JWT is accepted.
          for path in [
              'supabase/functions/billing-cron/index.ts',
              'supabase/functions/pix-ocr-retry/index.ts',
              'supabase/functions/whatsapp-sender/index.ts',
          ]:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              marker = '  try {\n'
              guard = '''  try {
    const authHeader = req.headers.get("Authorization") || "";
    const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";
    if (!serviceRoleKey || authHeader !== `Bearer ${serviceRoleKey}`) {
      return new Response(JSON.stringify({ error: "Unauthorized" }), {
        status: 401,
        headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }
'''
              if marker not in s:
                  raise SystemExit(f'CRON GUARD TARGET NOT FOUND: {path}')
              if s.count(marker) != 1:
                  raise SystemExit(f'CRON GUARD TARGET NOT UNIQUE: {path}: {s.count(marker)}')
              p.write_text(s.replace(marker, guard, 1), encoding='utf-8')

          # 4) Gateway reconciliation: external reference is identity; amount is
          # only secondary validation. Never auto-settle solely by equal amount.
          replace_once(
              'supabase/functions/bip-receiver/index.ts',
              '''          // Match by external reference in description or by amount
          invoice = invoices.find((inv: any) =>
            inv.description?.includes(parsed.externalId) ||
            (parsed.amount && Math.abs(Number(inv.amount) - parsed.amount) < 0.01)
          );
          // Fallback: if only one open invoice with that amount
          if (!invoice && parsed.amount) {
            const amountMatches = invoices.filter((inv: any) => Math.abs(Number(inv.amount) - parsed.amount!) < 0.01);
            if (amountMatches.length === 1) invoice = amountMatches[0];
          }''',
              '''          // External provider reference is the identity of the payment.
          // Amount is only a secondary consistency check; it is never an identity key.
          invoice = invoices.find((inv: any) => {
            if (!inv.description?.includes(parsed.externalId)) return false;
            if (parsed.amount == null) return true;
            return Math.abs(Number(inv.amount) - parsed.amount) < 0.01;
          });'''
          )

          print('All security hardening patches applied successfully.')
          PY

      - name: Commit hardening patches and remove one-time runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions .github/workflows/apply-security-hardening.yml
          git commit -m 'security: harden tenant and internal endpoint boundaries [security-hardening-applied]'
          git push
