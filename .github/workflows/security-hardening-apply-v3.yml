name: Security Hardening Apply v3
on:
  push:
    branches:
      - security-hardening-2026-09
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact hardening patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event.head_commit.message }}" == *"[security-hardening-auto]"* ]]; then
            echo "Hardening commit already applied; nothing to do."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p=Path(path); s=p.read_text()
              if s.count(old)!=1: raise SystemExit(f'{path}: anchor count={s.count(old)}')
              p.write_text(s.replace(old,new,1))

          r('supabase/functions/whatsapp-manager/index.ts', '''    const body = await req.json();
    const { action, instance_id, instance_name, organization_id } = body;

    if (!action) {''', '''    const body = await req.json();
    const { action, instance_id, instance_name, organization_id } = body;

    const { data: callerOrgId, error: callerOrgErr } = await userClient.rpc("get_user_organization_id");
    if (callerOrgErr || !callerOrgId) {
      return new Response(JSON.stringify({ error: "Organization not found for authenticated user" }), { status: 403, headers: { ...corsHeaders, "Content-Type": "application/json" } });
    }
    if (organization_id && organization_id !== callerOrgId) {
      return new Response(JSON.stringify({ error: "Forbidden: organization mismatch" }), { status: 403, headers: { ...corsHeaders, "Content-Type": "application/json" } });
    }
    if (instance_id) {
      const { data: ownedInstance, error: ownedErr } = await supabase.from("whatsapp_instances").select("id").eq("id", instance_id).eq("organization_id", callerOrgId).maybeSingle();
      if (ownedErr || !ownedInstance) {
        return new Response(JSON.stringify({ error: "Instance not found" }), { status: 404, headers: { ...corsHeaders, "Content-Type": "application/json" } });
      }
    }

    if (!action) {''')

          r('supabase/functions/whatsapp-manager/index.ts', '''      const targetInstances = instance_id
        ? (await supabase.from("whatsapp_instances").select("*").eq("id", instance_id)).data || []
        : (await supabase.from("whatsapp_instances").select("*").eq("organization_id", organization_id)).data || [];''', '''      const targetInstances = instance_id
        ? (await supabase.from("whatsapp_instances").select("*").eq("id", instance_id).eq("organization_id", callerOrgId)).data || []
        : (await supabase.from("whatsapp_instances").select("*").eq("organization_id", organization_id || callerOrgId)).data || [];''')

          r('supabase/functions/bip-receiver/index.ts', '''      // Try to find matching invoice by external ID or amount
      let invoice: any = null;

      if (parsed.externalId) {
        // Try matching by description containing the external ID
        const { data: invoices } = await supabase
          .from("invoices")
          .select("*, clients(name, phone, collector_id)")
          .eq("organization_id", orgParam)
          .eq("status", "aberto")
          .limit(50);

        if (invoices && invoices.length > 0) {
          // Match by external reference in description or by amount
          invoice = invoices.find((inv: any) =>
            inv.description?.includes(parsed.externalId) ||
            (parsed.amount && Math.abs(Number(inv.amount) - parsed.amount) < 0.01)
          );
          // Fallback: if only one open invoice with that amount
          if (!invoice && parsed.amount) {
            const amountMatches = invoices.filter((inv: any) => Math.abs(Number(inv.amount) - parsed.amount!) < 0.01);
            if (amountMatches.length === 1) invoice = amountMatches[0];
          }
        }
      }
''', '''      // Provider transaction/reference is the payment identity. Amount alone is never enough.
      let invoice: any = null;
      const externalId = String(parsed.externalId || "").trim();
      if (!externalId) {
        await logWebhook("rejected_missing_transaction_identity", 422, { amount: parsed.amount });
        return new Response(JSON.stringify({ received: true, action: "no_match", reason: "missing_transaction_identity" }), { status: 422, headers: { ...corsHeaders, "Content-Type": "application/json" } });
      }
      const { data: invoices } = await supabase.from("invoices").select("*, clients(name, phone, collector_id)").eq("organization_id", orgParam).eq("status", "aberto").limit(100);
      if (invoices && invoices.length > 0) {
        invoice = invoices.find((inv: any) => String(inv.description || "").includes(externalId));
      }
''')

          r('supabase/functions/bip-receiver/index.ts', '''      // Mark invoice as paid
      const paidDate = new Date().toISOString().split("T")[0];
      await supabase.from("invoices").update({
        status: "pago",
        paid_date: paidDate,
      }).eq("id", invoice.id);

      // Record transaction
      await supabase.from("transactions").insert({
        organization_id: orgParam,
        type: "entrada",
        amount: invoice.amount,
        description: `Baixa automática via ${providerParam} — ${invoice.clients?.name || "Cliente"}`,
        invoice_id: invoice.id,
      });
''', '''      const { data: settlement, error: settlementErr } = await supabase.rpc("settle_invoice_from_webhook", {
        p_organization_id: orgParam,
        p_invoice_id: invoice.id,
        p_provider: providerParam,
        p_external_id: externalId,
        p_amount: parsed.amount ?? null,
      });
      if (settlementErr) {
        console.error("[bip-receiver] atomic settlement failed", settlementErr);
        await logWebhook("settlement_error", 500, { error: settlementErr.message, invoice_id: invoice.id });
        return new Response(JSON.stringify({ error: "Payment settlement failed" }), { status: 500, headers: { ...corsHeaders, "Content-Type": "application/json" } });
      }
      if (settlement?.status !== "settled") {
        await logWebhook("settlement_not_applied", 200, { invoice_id: invoice.id, settlement });
        return new Response(JSON.stringify({ received: true, success: true, invoice_id: invoice.id, action: settlement?.status || "not_applied" }), { headers: { ...corsHeaders, "Content-Type": "application/json" } });
      }
      const paidDate = new Date().toISOString().split("T")[0];
''')

          r('supabase/functions/pix-ocr-settlement/index.ts', '  // last 8 digits fallback for partial cadastros\n  if (n.length >= 8) set.add(n.slice(-8));\n', '')

          Path('supabase/migrations/20260911060000_atomic_provider_payment_settlement.sql').write_text('''create table if not exists public.payment_webhook_events (id uuid primary key default gen_random_uuid(), organization_id uuid not null, provider text not null, external_id text not null, invoice_id uuid, amount numeric, created_at timestamptz not null default now());
create unique index if not exists uq_payment_webhook_events_identity on public.payment_webhook_events (organization_id, provider, external_id);
create index if not exists idx_payment_webhook_events_invoice on public.payment_webhook_events (organization_id, invoice_id);
alter table public.payment_webhook_events enable row level security;
revoke all on public.payment_webhook_events from anon, authenticated;
grant select, insert on public.payment_webhook_events to service_role;
create or replace function public.settle_invoice_from_webhook(p_organization_id uuid,p_invoice_id uuid,p_provider text,p_external_id text,p_amount numeric default null)
returns jsonb language plpgsql security definer set search_path=public as $$
declare v_invoice public.invoices%rowtype; v_event_id uuid;
begin
if nullif(trim(p_external_id),'') is null then return jsonb_build_object('status','rejected_missing_identity'); end if;
select * into v_invoice from public.invoices where id=p_invoice_id and organization_id=p_organization_id for update;
if not found then raise exception 'invoice_not_found_or_wrong_organization'; end if;
if p_amount is not null and abs(coalesce(v_invoice.amount,0)-p_amount)>0.01 then return jsonb_build_object('status','amount_mismatch','invoice_amount',v_invoice.amount); end if;
insert into public.payment_webhook_events(organization_id,provider,external_id,invoice_id,amount) values(p_organization_id,p_provider,trim(p_external_id),p_invoice_id,p_amount) on conflict(organization_id,provider,external_id) do nothing returning id into v_event_id;
if v_event_id is null then return jsonb_build_object('status','duplicate'); end if;
if v_invoice.status<>'aberto' then return jsonb_build_object('status','already_paid','invoice_id',v_invoice.id); end if;
update public.invoices set status='pago',paid_date=current_date where id=v_invoice.id;
insert into public.transactions(organization_id,type,amount,description,invoice_id) values(p_organization_id,'entrada',v_invoice.amount,'Baixa automática via '||p_provider||' — referência '||trim(p_external_id),v_invoice.id);
return jsonb_build_object('status','settled','invoice_id',v_invoice.id,'event_id',v_event_id);
end; $$;
revoke all on function public.settle_invoice_from_webhook(uuid,uuid,text,text,numeric) from public,anon,authenticated;
grant execute on function public.settle_invoice_from_webhook(uuid,uuid,text,text,numeric) to service_role;
''')

          Path('supabase/functions/_shared/pix/score.test.ts').write_text('''import { assertEquals } from "https://deno.land/std@0.224.0/assert/mod.ts";\nimport { computeScore, decisionAllowsAuto } from "./score.ts";\ntest("identity gate",()=>{const r=computeScore({client_identified:true,amount_found:true,txid_found:true,name_compatible:true,payer_known:true,single_open_match:true,match_source:"phone"});assertEquals(r.decision,"auto_high");assertEquals(decisionAllowsAuto(r.decision),true);});\ntest("no txid cannot auto",()=>{const r=computeScore({client_identified:true,amount_found:true,txid_found:false,name_compatible:true,payer_known:true,single_open_match:true,match_source:"phone"});assertEquals(decisionAllowsAuto(r.decision),false);});\ntest("fuzzy name cannot auto",()=>{const r=computeScore({client_identified:true,amount_found:true,txid_found:true,name_compatible:true,payer_known:false,single_open_match:true,match_source:"fuzzy_name"});assertEquals(decisionAllowsAuto(r.decision),false);});\n''')
          PY
          test -f supabase/migrations/20260911060000_atomic_provider_payment_settlement.sql
          grep -q 'get_user_organization_id' supabase/functions/whatsapp-manager/index.ts
          ! grep -q 'slice(-8)' supabase/functions/pix-ocr-settlement/index.ts
          ! grep -q 'Fallback: if only one open invoice with that amount' supabase/functions/bip-receiver/index.ts
          git config user.name security-hardening-bot
          git config user.email actions@github.com
          git add supabase/functions/whatsapp-manager/index.ts supabase/functions/bip-receiver/index.ts supabase/functions/pix-ocr-settlement/index.ts supabase/migrations/20260911060000_atomic_provider_payment_settlement.sql supabase/functions/_shared/pix/score.test.ts
          git commit -m 'security: close tenant and payment settlement gaps [security-hardening-auto]'
          git push origin security-hardening-2026-09
