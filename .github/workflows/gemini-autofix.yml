name: Gemini Auto-Fix App

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  autofix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Executar Correção Automática com Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c '
          import os, glob
          from google import genai

          client = genai.Client(api_key=os.environ.get("GEMINI_API_KEY"))

          # Busca arquivos Python/JS da interface no projeto
          files = glob.glob("**/*.py", recursive=True) + glob.glob("**/*.js", recursive=True)

          for file_path in files:
              if ".github" in file_path or "node_modules" in file_path or "venv" in file_path:
                  continue

              with open(file_path, "r", encoding="utf-8") as f:
                  code = f.read()

              prompt = f"""
              Você é um engenheiro de software sênior. Analise o código abaixo do arquivo {file_path}.
              Identifique quaisquer erros de sintaxe, bugs de interface ou falhas de execução.
              Retorne APENAS o código corrigido completo, sem explicações, sem marcadores de markdown como ```python.
              Se não houver erros, retorne exatamente o mesmo código fornecido.

              Código:
              {code}
              """

              response = client.models.generate_content(model="gemini-2.5-flash", contents=prompt)
              fixed_code = response.text.strip()

              # Limpa eventuais marcadores de código
              if fixed_code.startswith("```"):
                  lines = fixed_code.split("\n")
                  fixed_code = "\n".join(lines[1:-1])

              with open(file_path, "w", encoding="utf-8") as f:
                  f.write(fixed_code)

          print("Análise e correções concluídas com sucesso.")
          '

      - name: Commitar e Enviar Alterações Corrigidas
        run: |
          git config --global user.name "Gemini Auto-Fix Bot"
          git config --global user.email "action@github.com"
          git add .
          git diff --staged --quiet || (git commit -m "fix: correcoes automaticas aplicadas pelo Gemini" && git push)
