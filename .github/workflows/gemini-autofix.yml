name: Gemini Code Review (read-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Analisar código com Gemini (sem modificar arquivos)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from google import genai

          client = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
          roots = [Path("src"), Path("supabase/functions"), Path("deploy")]
          extensions = {".ts", ".tsx", ".js", ".jsx", ".py", ".sql"}
          files = [p for root in roots if root.exists() for p in root.rglob("*") if p.is_file() and p.suffix in extensions]

          findings = []
          for path in files:
              code = path.read_text(encoding="utf-8", errors="replace")
              if len(code) > 50000:
                  code = code[:50000]
              prompt = f"""
              Faça uma revisão de segurança e estabilidade do arquivo {path} de um SaaS financeiro multi-tenant.
              NÃO reescreva o código. Retorne somente uma lista objetiva de achados, cada um com:
              severidade (CRITICAL/HIGH/MEDIUM/LOW), linha aproximada, risco e correção recomendada.
              Se não houver achados relevantes, responda NO_SIGNIFICANT_FINDINGS.

              Código:
              {code}
              """
              response = client.models.generate_content(model="gemini-2.5-flash", contents=prompt)
              text = (response.text or "").strip()
              if text and text != "NO_SIGNIFICANT_FINDINGS":
                  findings.append(f"## {path}\n{text}\n")

          Path("gemini-review.md").write_text("# Gemini read-only review\n\n" + "\n".join(findings), encoding="utf-8")
          print(f"Reviewed {len(files)} files; report written to gemini-review.md")

      - name: Publicar relatório
        uses: actions/upload-artifact@v4
        with:
          name: gemini-security-review
          path: gemini-review.md
