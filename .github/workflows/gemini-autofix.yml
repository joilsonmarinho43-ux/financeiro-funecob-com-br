name: Funecob CI

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Validate WhatsApp backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check WhatsApp Edge Functions
        run: |
          set -e
          deno check supabase/functions/whatsapp-sender/index.ts
          deno check supabase/functions/whatsapp-webhook/index.ts
          deno check supabase/functions/whatsapp-manager/index.ts

      - name: Validate delivery-tracking migration
        run: |
          set -e
          test -s supabase/migrations/20260922115000_whatsapp_delivery_tracking.sql
          grep -q "provider_message_id" supabase/migrations/20260922115000_whatsapp_delivery_tracking.sql
          grep -q "delivered_at" supabase/migrations/20260922115000_whatsapp_delivery_tracking.sql
          grep -q "read_at" supabase/migrations/20260922115000_whatsapp_delivery_tracking.sql

      - name: Validate WhatsApp delivery integration
        run: |
          set -e
          grep -q "provider_message_id" supabase/functions/whatsapp-sender/index.ts
          grep -q "messages.update" supabase/functions/whatsapp-webhook/index.ts
          grep -q "MESSAGES_UPDATE" supabase/functions/whatsapp-manager/index.ts
          echo "WhatsApp delivery tracking: OK"
