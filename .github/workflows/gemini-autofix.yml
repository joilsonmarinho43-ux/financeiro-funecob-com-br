name: Gemini Code Review (read-only)

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Analisar código com Gemini (sem modificar arquivos)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from google import genai

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          if not api_key:
              Path("gemini-review.md").write_text(
                  "# Gemini read-only review\n\nGEMINI_API_KEY não configurada; revisão externa não executada.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          client = genai.Client(api_key=api_key)
          roots = [Path("src"), Path("supabase/functions"), Path("deploy")]
          extensions = {".ts", ".tsx", ".js", ".jsx", ".py", ".sql"}
          files = [
              p for root in roots if root.exists()
              for p in root.rglob("*")
              if p.is_file() and p.suffix in extensions
          ]

          findings = []
          failures = []
          for path in files:
              code = path.read_text(encoding="utf-8", errors="replace")
              if len(code) > 50000:
                  code = code[:50000]
              prompt = f"""
          Faça uma revisão de segurança e estabilidade do arquivo {path} de um SaaS financeiro multi-tenant.
          NÃO reescreva o código. Retorne somente uma lista objetiva de achados, cada um com:
          severidade (CRITICAL/HIGH/MEDIUM/LOW), linha aproximada, risco e correção recomendada.
          Se não houver achados relevantes, responda NO_SIGNIFICANT_FINDINGS.

          Código:
          {code}
          """

              response = None
              last_error = None
              for attempt in range(3):
                  try:
                      response = client.models.generate_content(
                          model="gemini-2.5-flash",
                          contents=prompt,
                      )
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(5 * (attempt + 1))

              if response is None:
                  failures.append(f"- {path}: {last_error}")
                  continue

              text = (response.text or "").strip()
              if text and text != "NO_SIGNIFICANT_FINDINGS":
                  findings.append(f"## {path}\n{text}\n")

          report = "# Gemini read-only review\n\n"
          if findings:
              report += "\n".join(findings)
          else:
              report += "NO_SIGNIFICANT_FINDINGS\n"
          if failures:
              report += "\n## Arquivos não revisados por falha temporária\n" + "\n".join(failures) + "\n"
          Path("gemini-review.md").write_text(report, encoding="utf-8")
          print(f"Reviewed {len(files)} files; findings={len(findings)} failures={len(failures)}")
          PY

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-security-review
          path: gemini-review.md
