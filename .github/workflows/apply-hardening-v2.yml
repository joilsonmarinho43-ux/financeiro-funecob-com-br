name: Final Edge Hardening
on:
  push:
    branches: [security-hardening-2026-09]
    paths: ['.github/workflows/apply-hardening-v2.yml']
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-v2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        run: |
          python - <<'PY'
          from pathlib import Path
          def p(path, old, new):
              f=Path(path); s=f.read_text(); c=s.count(old)
              if c!=1: raise SystemExit(f'{path}: target count={c}')
              f.write_text(s.replace(old,new,1))
