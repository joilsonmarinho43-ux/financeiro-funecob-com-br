name: Harden Edge Functions
on:
  push:
    branches: [security-hardening-2026-09]
    paths: ['.github/workflows/harden-edge-functions.yml']
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[edge-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact authorization guards
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8'); n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 match, got {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          replace('supabase/functions/whatsapp-manager/index.ts',
          '''    const body = await req.json();
              const { action, instance_id, instance_name, organization_id } = body;

              if (!action) {'''.replace('              ','    '),
          '''    const body = await req.json();
              const { action, instance_id, instance_name, organization_id } = body;

              const { data: callerOrganizationId, error: callerOrganizationError } = await supabase.rpc("get_user_organization_id", { _user_id: user.id });
              if (callerOrganizationError || !callerOrganizationId) {
                return new Response(JSON.stringify({ error: "Usuário sem organização autorizada" }), { status: 403, headers: { ...corsHeaders, "Content-Type": "application/json" } });
              }
              if (organization_id && organization_id !== callerOrganizationId) {
                return new Response(JSON.stringify({ error: "Acesso negado para esta organização" }), { status: 403, headers: { ...corsHeaders, "Content-Type": "application/json" } });
              }
              if (instance_id) {
                const { data: authorizedInstance } = await supabase.from("whatsapp_instances").select("id").eq("id", instance_id).eq("organization_id", callerOrganizationId).maybeSingle();
                if (!authorizedInstance) {
                  return new Response(JSON.stringify({ error: "Instância não encontrada ou não pertence à sua organização" }), { status: 404, headers: { ...corsHeaders, "Content-Type": "application/json" } });
                }
              }

              if (!action) {'''.replace('              ','    '))

          replace('supabase/functions/billing-cron/index.ts',
          '''  try {
    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;''',
          '''  try {
    const authHeader = req.headers.get("Authorization") || "";
    const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";
    if (!serviceRoleKey || authHeader !== `Bearer ${serviceRoleKey}`) {
      return new Response(JSON.stringify({ error: "Unauthorized" }), { status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" } });
    }
    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;''')

          replace('supabase/functions/pix-ocr-retry/index.ts',
          '''  if (req.method === "OPTIONS") return new Response("ok", { headers: corsHeaders });
  const supabase = createClient(SUPABASE_URL, SERVICE_KEY);''',
          '''  if (req.method === "OPTIONS") return new Response("ok", { headers: corsHeaders });
  const authHeader = req.headers.get("Authorization") || "";
  if (!SERVICE_KEY || authHeader !== `Bearer ${SERVICE_KEY}`) {
    return new Response(JSON.stringify({ error: "Unauthorized" }), { status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" } });
  }
  const supabase = createClient(SUPABASE_URL, SERVICE_KEY);''')

          replace('supabase/functions/whatsapp-sender/index.ts',
          '''  try {
    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;''',
          '''  try {
    const authHeader = req.headers.get("Authorization") || "";
    const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";
    if (!serviceRoleKey || authHeader !== `Bearer ${serviceRoleKey}`) {
      return new Response(JSON.stringify({ error: "Unauthorized" }), { status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" } });
    }
    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;''')

          replace('supabase/functions/register-pix-webhook/index.ts',
          '''    const authHeader = req.headers.get("Authorization");
    if (!authHeader) {
      return new Response(JSON.stringify({ error: "unauthorized" }), {
        status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }''',
          '''    const authHeader = req.headers.get("Authorization") || "";
    if (!SERVICE_KEY || authHeader !== `Bearer ${SERVICE_KEY}`) {
      return new Response(JSON.stringify({ error: "unauthorized" }), {
        status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }''')
          print('OK: all five guards patched')
          PY
      - name: Commit and remove one-time job
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions .github/workflows/harden-edge-functions.yml
          git commit -m 'security: enforce edge function authorization [edge-hardening-applied]'
          git push