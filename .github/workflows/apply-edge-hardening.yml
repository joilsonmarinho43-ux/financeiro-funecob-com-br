name: Apply validated Edge Function hardening

on:
  push:
    branches: [security-hardening-2026-09]
    paths:
      - '.github/workflows/apply-edge-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[edge-hardening-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply guarded changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 exact target, found {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Tenant authorization in whatsapp-manager. Service-role queries are
          # allowed, but every instance_id and organization_id is bound to the caller.
          once('supabase/functions/whatsapp-manager/index.ts',
'''    const body = await req.json();
    const { action, instance_id, instance_name, organization_id } = body;

    if (!action) {''',
'''    const body = await req.json();
    const { action, instance_id, instance_name, organization_id } = body;

    const { data: callerOrganizationId, error: callerOrganizationError } = await supabase
      .rpc("get_user_organization_id", { _user_id: user.id });
    if (callerOrganizationError || !callerOrganizationId) {
      return new Response(JSON.stringify({ error: "Usuário sem organização autorizada" }), {
        status: 403,
        headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }
    if (organization_id && organization_id !== callerOrganizationId) {
      return new Response(JSON.stringify({ error: "Acesso negado para esta organização" }), {
        status: 403,
        headers: { ...corsHeaders, "Content-Type": "application/json" },
      });
    }
    if (instance_id) {
      const { data: authorizedInstance } = await supabase
        .from("whatsapp_instances")
        .select("id")
        .eq("id", instance_id)
        .eq("organization_id", callerOrganizationId)
        .maybeSingle();
      if (!authorizedInstance) {
        return new Response(JSON.stringify({ error: "Instância não encontrada ou não pertence à sua organização" }), {
          status: 404,
          headers: { ...corsHeaders, "Content-Type": "application/json" },
        });
      }
    }

    if (!action) {''')

          # Internal cron functions: require the exact service-role bearer already
          # used for server-to-server invocations. This does not alter the cron payload.
          for path in [
              'supabase/functions/billing-cron/index.ts',
              'supabase/functions/pix-ocr-retry/index.ts',
              'supabase/functions/whatsapp-sender/index.ts',
          ]:
              p=Path(path); s=p.read_text(encoding='utf-8')
              old='''  try {\n    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;'''
              new='''  try {\n    const authHeader = req.headers.get("Authorization") || "";\n    const serviceRoleKey = Deno.env.get("SUPABASE_SERVICE_ROLE_KEY") || "";\n    if (!serviceRoleKey || authHeader !== `Bearer ${serviceRoleKey}`) {\n      return new Response(JSON.stringify({ error: "Unauthorized" }), {\n        status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" },\n      });\n    }\n    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;'''
              if path.endswith('pix-ocr-retry/index.ts') or path.endswith('whatsapp-sender/index.ts'):
                  old='''  try {\n    const supabaseUrl = Deno.env.get("SUPABASE_URL")!;'''
              n=s.count(old)
              if n != 1: raise SystemExit(f'{path}: expected 1 cron target, found {n}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Global webhook registration is machine-only. It intentionally operates
          # across all organizations, so a normal user JWT must never reach it.
          p=Path('supabase/functions/register-pix-webhook/index.ts'); s=p.read_text(encoding='utf-8')
          old='''    const authHeader = req.headers.get("Authorization");\n    if (!authHeader) {\n      return new Response(JSON.stringify({ error: "unauthorized" }), {\n        status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" },\n      });\n    }'''
          new='''    const authHeader = req.headers.get("Authorization") || "";\n    if (!SERVICE_KEY || authHeader !== `Bearer ${SERVICE_KEY}`) {\n      return new Response(JSON.stringify({ error: "unauthorized" }), {\n        status: 401, headers: { ...corsHeaders, "Content-Type": "application/json" },\n      });\n    }'''
          n=s.count(old)
          if n != 1: raise SystemExit(f'register-pix-webhook: expected auth target, found {n}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          print('validated edge hardening targets applied')

      - name: Commit and remove runner
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions .github/workflows/apply-edge-hardening.yml
          git commit -m 'security: harden edge function authorization [edge-hardening-applied]'
          git push